name: release

# A version is a tag: `yarn release <x.y.z>` commits, tags, and this workflow
# builds the self-contained bundle and publishes the GitHub release for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable corepack (yarn 4, pinned via packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Guard — package version matches the tag
        run: |
          tag="${{ github.ref_name }}"
          pkg="$(node -p "require('./package.json').version")"
          [ "${tag#v}" = "$pkg" ] || { echo "tag $tag does not match package version $pkg"; exit 1; }

      - name: Build the self-contained bundle
        run: yarn bundle

      - name: Package and checksum the bundle
        run: |
          tar czf palmux-linux-x64.tar.gz -C bin .
          sha256sum palmux-linux-x64.tar.gz > palmux-linux-x64.tar.gz.sha256

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "palmux ${{ github.ref_name }}" \
            palmux-linux-x64.tar.gz \
            palmux-linux-x64.tar.gz.sha256
